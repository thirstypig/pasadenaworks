name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Scheduled publishing: getPostsByLocale() in src/utils/blog.ts only builds
  # posts whose pubDate has arrived, so a post dated in the future needs a
  # rebuild ON that date to appear. GitHub Pages is static — without this cron
  # nothing would ever trigger that build and the post would stay invisible.
  # 13:00 UTC ≈ 6am Pacific, so a post dated today is live by breakfast.
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

# Scoped per JOB, not workflow-wide. `pages: write` and `id-token: write` are
# what let a job mint an OIDC token and upload a Pages artifact — i.e. publish
# arbitrary content to pasadenaworks.com. Granting them workflow-wide handed
# them to `build`, which runs third-party Actions and does not need them; only
# `deploy` does. Least privilege matters more than usual here because the build
# job executes actions from outside this repo.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Gate the deploy on the tests, including the daily scheduled publish.
      # A failing suite here stops the site from redeploying, which is the
      # intended trade: the failure it is most likely to catch is a post
      # silently missing from the collection, and shipping that is worse than
      # briefly not shipping at all. The run goes red either way, so it is
      # visible rather than silent.
      - name: Unit tests
        run: |
          npm ci
          npm run test

      - name: Build Tina Cloud admin bundle
        run: |
          npx tinacms build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}

      - name: Install, build, and upload
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
