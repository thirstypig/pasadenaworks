name: CI

# Runs on every pull request and every branch push, so a content mistake shows
# up as a red check before it can be merged.
#
# WHY THIS EXISTS: the invariants that protect this site's content are enforced
# by the test suite and by nothing else. The most important one — blog `slug`
# values being unique across ALL locales — fails SILENTLY at build time: Astro's
# glob loader dedupes on that field, drops one of the colliding posts, prints a
# warning, and exits 0. A build-only gate deploys that happily. Verified: a
# deliberate collision built green with `67 page(s) built` and exit code 0,
# while `npm run test` failed on it.
on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow's own test step

jobs:
  test:
    runs-on: ubuntu-latest
    # Read-only: this workflow only needs the checkout. It runs on
    # `pull_request` (not `pull_request_target`), so a fork's PR already cannot
    # reach secrets; this makes the token itself least-privilege too.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tina/tina-lock.json IS the schema Tina Cloud indexes from main. The
      # deploy's `npx tinacms build` compiles tina/config.ts fresh and compares
      # its hash to that file's; change config.ts without regenerating the lock
      # and EVERY deploy fails with ERR_CLOUD_CHECK_FAILED — after merge, with
      # build, typecheck and all tests green. That happened on 2026-09-04 across
      # four commits and took two hotfixes to recover from.
      #
      # `tinacms dev --no-server --noWatch` is the documented way to regenerate
      # the lock. No credentials, no network, ~4 seconds, so it runs on fork PRs
      # too. It also writes tina/__generated__/_schema.json, which is what lets
      # tina/lock.test.ts run the same comparison inside `npm run test` below.
      - name: Regenerate tina-lock.json and fail if tina/config.ts drifted from it
        run: |
          npx tinacms dev --no-server --noWatch --noTelemetry
          if ! git diff --quiet -- tina/tina-lock.json; then
            git --no-pager diff -- tina/tina-lock.json | head -c 4000
            echo "::error file=tina/tina-lock.json::tina/config.ts changed the compiled schema but tina/tina-lock.json was not regenerated. Tina Cloud indexes the schema FROM this file, so the deploy will fail after merge. Fix: run 'npx tinacms dev --no-server --noWatch' locally and commit tina/tina-lock.json in this PR. The diff above is exactly what your schema change does."
            exit 1
          fi

      # Content integrity, i18n routing, reading time, and the Tina match globs.
      - name: Unit tests
        run: npm run test

      # WHY THIS IS HERE AND NOT IN deploy.yml: nothing in this repo ran `tsc`
      # until now, so a type error was invisible — `npm run test` does not
      # typecheck, and `npm run build` passes because Astro never typechecks
      # tina/. One sat broken for days that way.
      #
      # It gates pull requests only, on purpose. deploy.yml's cron is what
      # makes a date-gated post actually publish, and a type error in tina/
      # cannot affect the built site at all — Astro does not compile that
      # folder. Blocking the daily publish over one would stop real content
      # from shipping to fix nothing.
      #
      # Covers .astro as well as .ts (via `astro check`), which is what makes the
      # `kind` unions on the dual-purpose routes enforceable — tsc alone cannot
      # parse .astro and silently skipped all 28 of them.
      #
      # The script runs `astro sync` first, and that is not optional: the types
      # for the virtual `astro:content` module are GENERATED into .astro/, which
      # is gitignored and therefore absent from a clean checkout. Without it,
      # tsc reports "Cannot find module 'astro:content'" plus a cascade of
      # implicit-any errors — and it passes on any laptop that has ever run a
      # build. Same trap as the readability step above, caught the same way:
      # by CI, on the first run.
      - name: Typecheck
        run: npm run typecheck

      # The Astro build is a second gate: it catches a broken frontmatter schema
      # or a route collision that the unit tests do not model. The Tina admin
      # bundle is deliberately not built here — it needs secrets a fork's PR
      # cannot see, and it is not what this check is protecting.
      #
      # The build exits 0 on a duplicate slug, so that warning is promoted to a
      # failure explicitly. Belt and braces alongside the unit tests.
      #
      # It does NOT cover the Tina path, despite what this comment used to say.
      # Tina commits to `main` (tina/config.ts: branch: 'main') and this workflow
      # is `push: branches-ignore: [main]`, so on the one path that claim named,
      # this step never runs — nor does typecheck, nor the post-build readability
      # check. A Tina-introduced collision is still caught, but by
      # blog-content.test.ts, which deploy.yml does run. Defence in depth here is
      # real for pull requests and absent for Tina; saying otherwise made the
      # gate look stronger than it is.
      - name: Build, and fail on a duplicate blog slug
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -q "multiple entries with the same slug" build.log; then
            echo "::error::Two blog posts share a slug. Astro silently drops one of them."
            exit 1
          fi

          # Same treatment, second warning. lightningcss reports an unparseable
          # selector and the build still exits 0 — which is how
          # `:global(html[lang^='zh']) body` sat in global.css for months, dead,
          # printing this warning on every single build while CLAUDE.md
          # documented the rule as working. The browser discards the WHOLE rule
          # when any part of a selector is invalid, so an unrecognised
          # pseudo-class means a block of CSS that silently does nothing.
          if grep -q "is not recognized as a valid pseudo-class" build.log; then
            echo "::error::Unparseable CSS selector — the browser will discard the entire rule. See the lightningcss warning above."
            exit 1
          fi

      # The WHOLE suite runs again here, not just the readability file.
      #
      # Several tests need dist/ and therefore SKIP in the unit-test step above,
      # because both workflows run tests before building: the readability
      # cross-check, and src/i18n/rendered-links.test.ts. Naming one file meant
      # the next dist-dependent test added would silently never run in CI — the
      # same trap the readability check itself shipped with, passing locally on
      # a laptop that had a stale dist/ lying around. Re-running everything
      # costs about a second and cannot go stale.
      #
      # What it protects: the blog is scored from markdown and the rest of the
      # site from rendered HTML, and the two must agree within half a grade.
      # Adding a component inside <main> silently breaks that agreement.
      - name: Re-run the suite against the built site
        run: |
          npm run test
          npm run readability -- --dist
